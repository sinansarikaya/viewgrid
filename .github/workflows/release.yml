name: Release Automation

on:
  push:
    tags:
      - 'v*'
  workflow_run:
    workflows: ['CI / Build & Test']
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: Build, Package & Publish Extension Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve release version
        id: version
        run: node -e "require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'tag=v' + require('./package.json').version + '\n')"

      - name: Check for an existing immutable release
        id: existing
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        with:
          script: |
            try {
              await github.rest.repos.getReleaseByTag({ ...context.repo, tag: process.env.RELEASE_TAG });
              return true;
            } catch (error) {
              if (error.status === 404) return false;
              throw error;
            }

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Tests
        run: pnpm test

      - name: Lint and typecheck
        run: pnpm run lint && pnpm run typecheck && pnpm run typecheck:website

      - name: Build extension packages
        run: pnpm run build:all

      - name: Verify committed browser builds are current
        run: git diff --exit-code -- dist

      - name: Validate Firefox package
        run: pnpm run lint:web-ext

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser regression tests
        run: pnpm run test:e2e

      - name: Install Firefox
        uses: browser-actions/setup-firefox@v1

      - name: Install GeckoDriver
        uses: browser-actions/setup-geckodriver@fac5b0424c584257f32cf12c5eb4ba86014c34f8

      - name: Install Firefox test driver
        run: python -m pip install selenium==4.36.0

      - name: Firefox browser regression tests
        run: python tests/e2e/firefox_extension.py

      - name: Package Release ZIPs & Generate SHA256SUMS
        run: pnpm run package:release

      - name: Publish GitHub Release
        if: steps.existing.outputs.result == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.event.workflow_run.head_sha || github.sha }}
          files: |
            release/*.zip
            release/SHA256SUMS
          draft: false
          prerelease: false
          body_path: docs/releases/${{ steps.version.outputs.tag }}.md
          generate_release_notes: true
