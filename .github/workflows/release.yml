name: Release Automation

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Extension Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Tests
        run: pnpm test

      - name: Build Extension Packages
        run: pnpm run build:all

      - name: Create Release Zip Archives
        run: |
          mkdir -p release
          cd dist/firefox && zip -r ../../release/viewgrid-${{ github.ref_name }}-firefox.zip . && cd ../..
          cd dist/chromium && zip -r ../../release/viewgrid-${{ github.ref_name }}-chromium.zip . && cd ../..

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/viewgrid-${{ github.ref_name }}-firefox.zip
            release/viewgrid-${{ github.ref_name }}-chromium.zip
          draft: false
          prerelease: false
          generate_release_notes: true
