name: CI / Build & Test

on:
  push:
    branches: [ main, release/* ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Lint, Typecheck, Test, Web-Ext & Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Codebase Linting (ESLint)
        run: pnpm run lint

      - name: Extension Typecheck (tsc)
        run: pnpm run typecheck

      - name: Website Typecheck (tsc)
        run: pnpm run typecheck:website

      - name: Run Unit Tests (Vitest)
        run: pnpm test

      - name: Build All Extension Packages
        run: pnpm run build:all

      - name: Validate Firefox Extension (web-ext lint)
        run: pnpm run lint:web-ext

      - name: Build Marketing Website (Vite)
        run: pnpm run build:website

      - name: Package Release ZIPs & Checksums
        run: pnpm run package:release

      - name: Verify Release Artifacts
        shell: bash
        run: |
          set -euo pipefail

          version="$(node -p "require('./package.json').version")"

          artifacts=(
            "release/viewgrid-${version}-chromium.zip"
            "release/viewgrid-${version}-firefox.zip"
            "release/viewgrid-${version}-source.zip"
            "release/SHA256SUMS"
          )

          for artifact in "${artifacts[@]}"; do
            if [[ ! -f "$artifact" ]]; then
              echo "::error::Missing release artifact: $artifact"
              echo "Generated release files:"
              find release -maxdepth 1 -type f -printf '%f\n' 2>/dev/null || ls -la release/
              exit 1
            fi
          done

          echo "All release artifacts verified for version ${version}."
