name: CI / Build & Test

on:
  push:
    branches: [ main, release/* ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Typecheck, Test & Build (Firefox + Chromium)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Typecheck
        run: pnpm run typecheck

      - name: Run Unit Tests
        run: pnpm test

      - name: Build All Extension Packages
        run: pnpm run build:all

      - name: Verify Firefox Build Directory
        run: test -f dist/firefox/manifest.json

      - name: Verify Chromium Build Directory
        run: test -f dist/chromium/manifest.json
